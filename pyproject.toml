[project]
name = "sql-server-mcp"
version = "0.1.0"
description = "MCP server for SQL Server databases — share tools, users bring their own credentials"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "pyodbc>=5.0",
]

[project.scripts]
sql-server-mcp = "sql_server_mcp.__main__:main"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sql_server_mcp"]
